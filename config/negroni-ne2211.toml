# OnePlus 10 Pro NE2211 board config for the iOS 16 track (from external/UniXNU-negroni/board.toml,
# made on an NE2213). Paths are relative to the iOSPlus10 repo.

[board]
name = "negroni"
soc = "SM8450"
model = "NE2211"

[kernel]
# xnu-8796 + slop negroni-ios/xnu/patches, built by the slop CI (public artifact, no secrets)
repo = "MellysInformejtik/slop"
workflow = "negroni-ios"
artifact = "negroni-ios-kernel"
macho = "kernel.development.negroni"
run = "40007883255"                 # newest green run on 2026-10-24 (kernel 0124); artifact expires 2027-01-21

[adt]
tool = "external/slop/negroni-ios/tools/mkadt.py"
# --dram BASE:SIZE: SIZE = the XNU window DarwinBoot allocates (ADT darwinboot-memory-size), 7 GiB since kernel
# patch 0401 (was C0000000 = 3 GiB): 0x841004000..0xA01004000. Layout and checks: [ram] below, docs/notes.md section 90.
args = ["--board", "negroni", "--ufs", "--dram", "840000000:1C0000000", "--darwinboot"]

# Physical RAM layout of the 9 GiB System RAM bank (docs/notes.md section 90). scripts/ios16/adt-extra.py:
#  - writes /chosen negroni-ram-bank (bank) and negroni-ram-reserved (gpu) for the kernel self-check (patch 0401);
#  - checks the window (adt --dram SIZE at Mu "Kernel RAM" base + 16 KiB) against the bank, the gpu region and the
#    Mu FD's "Kernel RAM" region (read from out/mu/SILICIUM_UEFI-DEBUG.fd, with uefi_headroom left for UEFI);
#    on a failure, or with XNU_RAM=0, it writes fallback into dram-size/darwinboot-memory-size and prints
#    "NEGRONI RAM: off: <reason>".
# scripts/ios16/build.sh gives the GPU pool its base: negronigpu_poolbase=<gpu base> (unless kernel_args has one).
# Kernel kill switch: negroniram=0 (XNU keeps 3 GiB of the window).
[ram]
bank = "840000000:240000000"      # ABL /memory 0x840000000 + 3 GiB and 0x900000000 + 6 GiB, contiguous [V]
gpu = "A20000000:60000000"        # outside XNU and UEFI: GPU write-combined pool, 1.5 GiB to the bank end (negronigpu_pool=1536)
fallback = "C0000000"             # 3 GiB: the window before 0401
uefi_headroom = "10000000"        # at least 256 MiB of the Mu region above the window for UEFI (0002 leaves 496 MiB)

# Extra ADT properties (scripts/ios16/adt-extra.py). Locally administered MACs (02:...):
# MobileGestalt needs them, else lsd/installd stall per app bundle (15+ min first boot).
[adt.extra.chosen]
"mac-address-wifi0" = "02:00:5e:77:ee:10"
"mac-address-bluetooth0" = "02:00:5e:77:ee:11"
"mac-address-ethernet0" = "02:00:5e:77:ee:12"

# /arm-io/bluetooth, only with ADT_BT=1 (scripts/ios16/adt-extra.py; Bluetooth stage B, patch 0332, negronibt=4).
# Values as the D22AP node /arm-io/uart1/bluetooth (external/bergamota/docs/BT_IOS_TRANSPORT.md 1.1) except the
# address (= mac-address-bluetooth0; the kernel writes it into the controller, HCI step 20) and compatible.
# Strings: "str:...", u32: integers, raw bytes: hex.
[adt.bluetooth]
"device_type" = "str:bluetooth"
"compatible" = "str:bluetooth,qca6490"
"local-mac-address" = "02:00:5e:77:ee:11"
"transport-encoding" = 3          # H4BC (bluetoothd 0x100156160); BT_HCI_TRANSPORT in the job overrides it
"transport-speed" = 3000000       # the rate stage A leaves the controller at (negronibt_baud)
"vendor-id" = 0x05ac
"product-id" = 0x12a0

[payload]
tool = "external/slop/negroni-ios/tools/mkdarwinboot.py"
volume = "NEGRONIESP"
size_mib = 64
timeout = 3
kernel_args = [
  "debug=0xc",
  "serial=3",
  "cpus=8",
  "negronicpufreq_floor=lut",
  "keepsyms=1",
  "-noprogress",
  "rd=ufsroot0",
  "ufsrw=1",
  "rootrw=1",
  "unentitled_ios_sim_launch=1",
  "ignition_level=1",
  "wdt_test=no_user_checkin",
  "launchd_unsecure_cache=1",
  "wdt=-1",
  "negronikeys=1",
  "negronitouch=1",
  "negroniusb=2",          # USB Ethernet + live kernel log (make usblog); the port used 0
  "negronisample=-",
  "negronifb_noconsole=1",
  "negronifb_hz=120",
  "negronifb_clockshift=100",
  "negroniwifi=4",
  "negroniadreno=22",
  "negroniadreno_keep=1",
  "negronigpu_pool=1536",         # the whole [ram] gpu region at its base (build.sh adds negronigpu_poolbase); 0402: 512 was full 40 s after boot
  # no negronigpu_level: the 0384 governor (simple_ondemand on the GMU busy counter, 220-818 MHz) picks the level;
  # negronigpu_level=N (BOOTARGS_ADD) is a fixed-level override that turns the governor off
]

[bootimg]
# boot_a: ios-sweet shim (BOARD=negroni) as kernel; ramdisk = Mu FD, padded to 1 MiB, + payload FAT
header_version = 4
pagesize = 4096
os_version = "12.0.0"
os_patch_level = "2026-03-00"
cmdline = "bootconfig"
# vendor_boot_a: header v4 with only the mainline DTB (ABL takes the DTB from vendor_boot only)
dtb = "external/Mu-Silicium-negroni/Platforms/OnePlus/negroniPkg/FdtBlob/sm8450-oneplus-negroni.dtb"
